<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker>
    <style>
      .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .t{fill:#e6edf3} .m{fill:#7d8590} .g{fill:#3fb950} .r{fill:#f85149} .a{fill:#d29922} .b{fill:#58a6ff} .p{fill:#bc8cff}
    </style>
  </defs>
  <rect width="900" height="540" rx="10" fill="#0d1117"/>
  <text x="32" y="44" class="t" font-size="20" font-weight="700">The Persona Is Generated — Here Is the Proof</text>
  <text x="32" y="66" class="m" font-size="13">Every token comes from Faker's English locale. The structure does not.</text>
  <line x1="32" y1="82" x2="868" y2="82" stroke="#21262d"/>

  <!-- the name -->
  <text x="32" y="130" class="m" font-size="11" font-weight="600">OBSERVED DISPLAY NAME</text>
  <text x="32" y="164" class="mono" font-size="26" font-weight="600">
    <tspan class="b">Jaylon</tspan><tspan class="m">_</tspan><tspan class="a">Stiedemann</tspan><tspan class="m">-</tspan><tspan class="g">Terry</tspan><tspan class="p">78</tspan>
  </text>

  <line x1="70"  y1="176" x2="70"  y2="206" stroke="#7d8590" marker-end="url(#a4)"/>
  <line x1="205" y1="176" x2="205" y2="206" stroke="#7d8590" marker-end="url(#a4)"/>
  <line x1="360" y1="176" x2="360" y2="206" stroke="#7d8590" marker-end="url(#a4)"/>

  <rect x="32" y="212" width="150" height="62" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="232" class="b mono" font-size="12">Jaylon</text>
  <text x="44" y="250" class="m mono" font-size="10">first_name.ts</text>
  <text x="44" y="266" class="m mono" font-size="10">line 2514</text>

  <rect x="192" y="212" width="150" height="62" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="204" y="232" class="a mono" font-size="12">Stiedemann</text>
  <text x="204" y="250" class="m mono" font-size="10">last_name.ts</text>
  <text x="204" y="266" class="m mono" font-size="10">line 408</text>

  <rect x="352" y="212" width="150" height="62" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="364" y="232" class="g mono" font-size="12">Terry</text>
  <text x="364" y="250" class="m mono" font-size="10">last_name.ts</text>
  <text x="364" y="266" class="m mono" font-size="10">line 417</text>

  <!-- the proof -->
  <rect x="532" y="106" width="336" height="168" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity="0.45"/>
  <text x="550" y="130" class="r" font-size="11" font-weight="600">THE STRUCTURAL PROOF</text>
  <text x="550" y="156" class="m mono" font-size="11">$ grep -c -- '-' last_name.ts</text>
  <text x="550" y="176" class="r mono" font-size="16" font-weight="700">0</text>
  <text x="550" y="204" class="t" font-size="11">Faker's 466-entry surname list</text>
  <text x="550" y="220" class="t" font-size="11">contains <tspan class="r" font-weight="600">zero hyphens</tspan>.</text>
  <text x="550" y="244" class="t" font-size="11">So <tspan class="mono a">Stiedemann-Terry</tspan> is two</text>
  <text x="550" y="260" class="t" font-size="11">independent draws — a custom template.</text>

  <!-- template + namespace -->
  <rect x="32" y="298" width="470" height="112" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="322" class="m" font-size="11" font-weight="600">RECONSTRUCTED TEMPLATE</text>
  <text x="50" y="350" class="t mono" font-size="14">{firstName}_{lastName}-{lastName}{2 digits}</text>
  <text x="50" y="376" class="m mono" font-size="12">3185 × 466 × 466 × 100</text>
  <text x="50" y="398" class="a mono" font-size="15" font-weight="700">= 69,164,186,000 personas</text>

  <rect x="532" y="298" width="336" height="112" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="550" y="322" class="m" font-size="11" font-weight="600">SUPPLY, IN CONTEXT</text>
  <text x="550" y="348" class="t" font-size="12">≈ <tspan class="a" font-weight="700">8 personas for every human alive</tspan></text>
  <text x="550" y="372" class="m" font-size="11">No username blocklist ever catches up.</text>
  <text x="550" y="392" class="m" font-size="11">The template, however, is a free classifier feature.</text>

  <!-- profile -->
  <rect x="32" y="430" width="836" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="454" class="m" font-size="11" font-weight="600">THE REST OF THE PROFILE</text>
  <text x="50" y="478" class="mono" font-size="11"><tspan class="m">user_id</tspan> <tspan class="t">3748129</tspan>   <tspan class="m">joined</tspan> <tspan class="t">2026-02-02</tspan>   <tspan class="m">articles</tspan> <tspan class="r">0</tspan>   <tspan class="m">bio</tspan> <tspan class="r">null</tspan>   <tspan class="m">location</tspan> <tspan class="r">null</tspan>   <tspan class="m">github</tspan> <tspan class="r">null</tspan></text>
  <text x="50" y="498" class="m" font-size="11">Avatar: a public-domain Victorian engraving of a wombat. 400×400 grayscale+alpha PNG, metadata stripped.</text>
</svg>
