<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
    <style>
      .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      .t{fill:#e6edf3} .m{fill:#7d8590} .g{fill:#3fb950} .r{fill:#f85149} .a{fill:#d29922} .b{fill:#58a6ff} .p{fill:#bc8cff}
    </style>
  </defs>
  <rect width="900" height="620" rx="10" fill="#0d1117"/>
  <text x="32" y="44" class="t" font-size="20" font-weight="700">The Chain</text>
  <text x="32" y="66" class="m" font-size="13">One spam comment, three hops, zero malware</text>
  <line x1="32" y1="82" x2="868" y2="82" stroke="#21262d" stroke-width="1"/>

  <!-- 1 comment -->
  <rect x="32" y="102" width="470" height="86" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="124" class="m" font-size="11" font-weight="600">① DEV COMMENT · 2026-09-09T18:25:17Z</text>
  <text x="48" y="146" class="t mono" font-size="12">Stop wasting time applying manually</text>
  <text x="48" y="163" class="t mono" font-size="12">Let AI handle your job applications every single day</text>
  <text x="48" y="180" class="b mono" font-size="12">tinyurl.com/36nsecn5</text>
  <text x="522" y="140" class="m" font-size="11">posted by</text>
  <text x="522" y="158" class="p mono" font-size="12">@jaylonstiedemannterry78-993</text>
  <text x="522" y="176" class="m" font-size="11">0 articles · empty profile · wombat avatar</text>

  <line x1="70" y1="188" x2="70" y2="222" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 2 tinyurl -->
  <rect x="32" y="228" width="470" height="76" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="250" class="m" font-size="11" font-weight="600">② SHORTENER</text>
  <text x="48" y="272" class="t mono" font-size="13">tinyurl.com/36nsecn5</text>
  <text x="48" y="292" class="g mono" font-size="11">HTTP/2 301  ·  x-robots-tag: noindex</text>
  <text x="522" y="272" class="m" font-size="11">Never click. Ask for headers:</text>
  <text x="522" y="290" class="a mono" font-size="11">curl -sS -I &lt;url&gt;</text>

  <line x1="70" y1="304" x2="70" y2="338" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 3 redirector -->
  <rect x="32" y="344" width="470" height="112" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity="0.45"/>
  <text x="48" y="366" class="m" font-size="11" font-weight="600">③ REDIRECTOR  <tspan class="r">← the only attacker-controlled hop</tspan></text>
  <text x="48" y="388" class="t mono" font-size="13">zenviapro.store/massapply?whose=yahoo</text>
  <text x="48" y="408" class="g mono" font-size="11">HTTP/1.1 302 Found</text>
  <text x="48" y="425" class="a mono" font-size="11">X-Powered-By: Express</text>
  <text x="48" y="442" class="m mono" font-size="11">"Found. Redirecting to …"  ·  48 bytes text/plain</text>
  <text x="522" y="380" class="m" font-size="11">50.114.206.36 · AS62564 Linveo</text>
  <text x="522" y="398" class="m" font-size="11">One route. <tspan class="r">/ returns "Cannot GET /"</tspan></text>
  <text x="522" y="416" class="m" font-size="11"><tspan class="a">whose=</tspan> is INERT — every value</text>
  <text x="522" y="432" class="m" font-size="11">routes identically. It is a prop.</text>
  <text x="522" y="450" class="m" font-size="11">No cloaking: Googlebot = curl = phone</text>

  <line x1="70" y1="456" x2="70" y2="490" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 4 destination -->
  <rect x="32" y="496" width="470" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-opacity="0.45"/>
  <text x="48" y="518" class="m" font-size="11" font-weight="600">④ DESTINATION  <tspan class="g">← LEGITIMATE SaaS</tspan></text>
  <text x="48" y="540" class="t mono" font-size="13">loopcv.pro/<tspan class="a">?via=md</tspan></text>
  <text x="48" y="560" class="g mono" font-size="11">HTTP/2 200  ·  real product, real company</text>
  <text x="48" y="578" class="m" font-size="11">?via= is Rewardful's referral parameter</text>
  <text x="522" y="524" class="g" font-size="12" font-weight="700">NOT AN IOC.</text>
  <text x="522" y="542" class="m" font-size="11">LoopCV is the victim here — its brand</text>
  <text x="522" y="558" class="m" font-size="11">is being welded to comment spam by an</text>
  <text x="522" y="574" class="m" font-size="11">affiliate it has likely never spoken to.</text>
</svg>
