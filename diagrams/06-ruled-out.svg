<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs><style>
    .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .t{fill:#e6edf3} .m{fill:#7d8590} .g{fill:#3fb950} .r{fill:#f85149} .a{fill:#d29922} .b{fill:#58a6ff}
  </style></defs>
  <rect width="900" height="450" rx="10" fill="#0d1117"/>
  <text x="32" y="44" class="t" font-size="20" font-weight="700">The Lead That Looked Perfect — and Was Wrong</text>
  <text x="32" y="66" class="m" font-size="13">Showing the ruled-out cluster, because a matching name is not a matching operator</text>
  <line x1="32" y1="82" x2="868" y2="82" stroke="#21262d"/>

  <rect x="32" y="102" width="404" height="212" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity="0.4"/>
  <text x="50" y="126" class="r" font-size="11" font-weight="600">RULED OUT — flagged by PhishDestroy</text>
  <text x="50" y="150" class="t mono" font-size="11">zenviaetc.info    zenvias.info</text>
  <text x="50" y="168" class="t mono" font-size="11">zenviahub.info    zenviatime.info</text>
  <text x="50" y="186" class="a mono" font-size="11">zenviapro.info</text><text x="196" y="186" class="t mono" font-size="11">    zenviazone.info</text>
  <line x1="50" y1="200" x2="418" y2="200" stroke="#21262d"/>
  <text x="50" y="222" class="m mono" font-size="11">registrar  NameSilo</text>
  <text x="50" y="240" class="m mono" font-size="11">DNS        asa + harley .ns.cloudflare.com</text>
  <text x="50" y="258" class="m mono" font-size="11">hosting    Cloudflare proxy</text>
  <text x="50" y="276" class="m mono" font-size="11">TLD        .info × 6</text>
  <text x="50" y="300" class="a" font-size="11">All six share ONE Cloudflare account — genuinely one operator.</text>

  <rect x="464" y="102" width="404" height="212" rx="8" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.4"/>
  <text x="482" y="126" class="b" font-size="11" font-weight="600">OUR CAMPAIGN</text>
  <text x="482" y="152" class="t mono" font-size="13">zenviapro.store</text>
  <line x1="482" y1="200" x2="850" y2="200" stroke="#21262d"/>
  <text x="482" y="222" class="m mono" font-size="11">registrar  <tspan class="r">Namecheap</tspan></text>
  <text x="482" y="240" class="m mono" font-size="11">DNS        <tspan class="r">dns1/2.registrar-servers.com</tspan></text>
  <text x="482" y="258" class="m mono" font-size="11">hosting    <tspan class="r">Linveo direct, no proxy</tspan></text>
  <text x="482" y="276" class="m mono" font-size="11">TLD        <tspan class="r">.store</tspan></text>
  <text x="482" y="300" class="b" font-size="11">Nothing shared but six letters.</text>

  <rect x="32" y="332" width="836" height="94" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="356" class="m" font-size="11" font-weight="600">WHY THE LABEL COLLIDES</text>
  <text x="50" y="380" class="t" font-size="12">Both are riding <tspan class="a" font-weight="600">Zenvia</tspan>, a real Brazilian CPaaS company. Two unrelated operators reached for the same brandable string.</text>
  <text x="50" y="406" class="t" font-size="12" font-weight="600">Check registrar + DNS + hosting before you claim a cluster. Stopping at the grep publishes a confident, wrong attribution.</text>
</svg>
