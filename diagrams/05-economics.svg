<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs><style>
    .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .t{fill:#e6edf3} .m{fill:#7d8590} .g{fill:#3fb950} .r{fill:#f85149} .a{fill:#d29922} .b{fill:#58a6ff}
  </style></defs>
  <rect width="900" height="470" rx="10" fill="#0d1117"/>
  <text x="32" y="44" class="t" font-size="20" font-weight="700">The Economics Are the Vulnerability</text>
  <text x="32" y="66" class="m" font-size="13">Exact interval arithmetic — agent-calc, contract calc1/0.1.0</text>
  <line x1="32" y1="82" x2="868" y2="82" stroke="#21262d"/>

  <rect x="32" y="102" width="400" height="196" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="126" class="m" font-size="11" font-weight="600">REVENUE PER CONVERTED REFERRAL</text>
  <text x="50" y="156" class="mono" font-size="12"><tspan class="m">subscription  </tspan><tspan class="t">[$50, $200]</tspan><tspan class="m"> / month</tspan></text>
  <text x="50" y="178" class="mono" font-size="12"><tspan class="m">retention     </tspan><tspan class="t">[6, 12]</tspan><tspan class="m"> months</tspan></text>
  <line x1="50" y1="192" x2="414" y2="192" stroke="#21262d"/>
  <text x="50" y="216" class="mono" font-size="12"><tspan class="m">gross         </tspan><tspan class="b">[$300, $2,400]</tspan></text>
  <text x="50" y="240" class="mono" font-size="12"><tspan class="m">× 25% commission</tspan></text>
  <line x1="50" y1="252" x2="414" y2="252" stroke="#21262d"/>
  <text x="50" y="280" class="mono" font-size="17" font-weight="700"><tspan class="m">payout  </tspan><tspan class="g">[$75, $600]</tspan></text>

  <rect x="468" y="102" width="400" height="196" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="486" y="126" class="m" font-size="11" font-weight="600">COST TO RUN IT FOR A YEAR</text>
  <text x="486" y="156" class="mono" font-size="12"><tspan class="m">.store domain </tspan><tspan class="t">~$2 – $60</tspan></text>
  <text x="486" y="178" class="mono" font-size="12"><tspan class="m">budget hosting</tspan><tspan class="t"> ~$36 – $120</tspan></text>
  <line x1="486" y1="192" x2="850" y2="192" stroke="#21262d"/>
  <text x="486" y="216" class="mono" font-size="12"><tspan class="m">total         </tspan><tspan class="a">[$38, $180]</tspan></text>
  <text x="486" y="244" class="m" font-size="11">One Express route. One Namecheap domain.</text>
  <text x="486" y="262" class="m" font-size="11">One aged account. One wombat.</text>
  <text x="486" y="284" class="m" font-size="11">No exploit, no payload, nothing illegal.</text>

  <rect x="32" y="318" width="836" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="50" y="342" class="m" font-size="11" font-weight="600">BREAK-EVEN</text>
  <text x="50" y="374" class="mono" font-size="15"><tspan class="a">[$38, $180]</tspan><tspan class="m"> ÷ </tspan><tspan class="g">[$75, $600]</tspan><tspan class="m">  =  </tspan><tspan class="t">[19/300, 12/5]</tspan><tspan class="m">  =  </tspan><tspan class="g" font-size="17" font-weight="700">0.06 – 2.4 conversions/year</tspan></text>

  <text x="32" y="432" class="t" font-size="15" font-weight="700">At most three signups a year pays for the entire operation.</text>
  <text x="32" y="454" class="m" font-size="12">Nothing here has to work well. You cannot out-moderate that math — only the vendor revoking token <tspan class="mono a">via=md</tspan> ends it.</text>
</svg>
