<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs><style>
    .mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .t{fill:#e6edf3} .m{fill:#7d8590} .g{fill:#3fb950} .r{fill:#f85149} .a{fill:#d29922} .b{fill:#58a6ff} .p{fill:#bc8cff}
  </style></defs>
  <rect width="900" height="380" rx="10" fill="#0d1117"/>
  <text x="32" y="44" class="t" font-size="20" font-weight="700">Provisioning Timeline</text>
  <text x="32" y="66" class="m" font-size="13">Sloppy at the application layer. Disciplined at the account-aging layer.</text>
  <line x1="32" y1="82" x2="868" y2="82" stroke="#21262d"/>

  <!-- dormancy band -->
  <rect x="99" y="150" width="586" height="58" fill="#d29922" fill-opacity="0.07" stroke="#d29922" stroke-opacity="0.3" stroke-dasharray="5,4" rx="4"/>
  <text x="392" y="176" class="a" font-size="13" font-weight="700" text-anchor="middle">184 DAYS DORMANT</text>
  <text x="392" y="196" class="m" font-size="11" text-anchor="middle">assets aged past new-domain and new-account reputation heuristics</text>

  <!-- axis -->
  <line x1="80" y1="230" x2="840" y2="230" stroke="#30363d" stroke-width="2"/>

  <!-- markers -->
  <circle cx="80"  cy="230" r="6" fill="#58a6ff"/>
  <circle cx="100" cy="230" r="6" fill="#bc8cff"/>
  <circle cx="685" cy="230" r="6" fill="#3fb950"/>
  <circle cx="820" cy="230" r="6" fill="#f85149"/>

  <!-- labels above -->
  <line x1="80" y1="230" x2="80" y2="132" stroke="#58a6ff" stroke-opacity="0.4"/>
  <text x="80" y="124" class="b mono" font-size="11" text-anchor="middle">2026-01-27</text>
  <text x="80" y="108" class="t" font-size="11" text-anchor="middle" font-weight="600">domain registered</text>

  <line x1="100" y1="230" x2="100" y2="262" stroke="#bc8cff" stroke-opacity="0.4"/>
  <text x="100" y="278" class="p mono" font-size="11" text-anchor="middle">2026-02-02</text>
  <text x="100" y="294" class="t" font-size="11" text-anchor="middle" font-weight="600">DEV account created</text>
  <text x="100" y="310" class="a" font-size="10" text-anchor="middle">+6 days — same burst</text>

  <line x1="685" y1="230" x2="685" y2="132" stroke="#3fb950" stroke-opacity="0.4"/>
  <text x="685" y="124" class="g mono" font-size="11" text-anchor="middle">2026-07-30</text>
  <text x="685" y="108" class="t" font-size="11" text-anchor="middle" font-weight="600">first TLS certificate</text>

  <line x1="820" y1="230" x2="820" y2="262" stroke="#f85149" stroke-opacity="0.4"/>
  <text x="820" y="278" class="r mono" font-size="11" text-anchor="middle">2026-09-09</text>
  <text x="820" y="294" class="t" font-size="11" text-anchor="middle" font-weight="600">spam posted</text>
  <text x="820" y="310" class="m" font-size="10" text-anchor="middle">8 days after the</text>
  <text x="820" y="323" class="m" font-size="10" text-anchor="middle">article went up</text>

  <text x="32" y="356" class="m" font-size="12">Aging assets costs <tspan class="t" font-weight="600">patience</tspan>, not skill — which is exactly the skill profile the rest of the evidence shows.</text>
</svg>
